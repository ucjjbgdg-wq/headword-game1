
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้ามพูด! - Forbidden Word Game</title>
<style>
:root {
  --bg:#0b1020; --panel:#151d32; --line:#293550;
  --text:#f4f6ff; --muted:#aab5ce; --purple:#9b87ff;
  --red:#ff6377; --green:#4de0ae; --yellow:#ffd166;
}
* {box-sizing:border-box}
body {
  margin:0; background:radial-gradient(circle at top,#20264b,var(--bg) 48%);
  color:var(--text); font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh; padding:20px 12px 40px;
}
.container {max-width:900px;margin:auto}
header{text-align:center;padding:18px 8px 22px}
.logo {font-size:48px}
h1 {font-size:clamp(28px,6vw,42px);margin:4px 0}
.subtitle {color:var(--muted);font-size:14px}
.panel,.player {
  background:rgba(21,29,50,.96);border:1px solid var(--line);
  border-radius:20px;padding:18px;margin-bottom:16px;
}
h2 {font-size:18px;margin:0 0 14px}
label {display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
select,button {
  font:inherit;border:0;border-radius:12px;padding:12px;
}
select {
  width:100%;background:#0d1427;color:white;border:1px solid var(--line);
}
button {cursor:pointer;font-weight:700;transition:.15s}
button:active {transform:scale(.97)}
button:disabled {opacity:.4;cursor:not-allowed}
.primary {background:var(--purple);color:#100c28}
.secondary {background:#27324c;color:white}
.danger {background:#642638;color:#ffe3e8}
.success {background:#174d43;color:#b9ffeb}
.warning {background:#58451b;color:#ffedb1}
.row {display:flex;gap:8px;flex-wrap:wrap}
.row button {flex:1;min-width:105px}
.players {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.player {margin:0;min-width:0}
.player h2 {display:flex;justify-content:space-between;align-items:center}
.badge {font-size:11px;padding:5px 8px;border-radius:20px;background:#293550;color:#d9e1ff}
.word {
  background:#0b1225;border:1px dashed #505b80;border-radius:16px;
  padding:18px 8px;text-align:center;margin:12px 0;
}
.word small {color:var(--muted);display:block;font-size:12px}
.word strong {font-size:clamp(25px,6vw,36px);display:block;margin-top:8px;overflow-wrap:anywhere}
.hidden-word {filter:blur(7px);user-select:none}
.clock {font-size:35px;font-weight:850;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.status {text-align:center;font-size:13px;color:var(--muted);min-height:22px;margin-bottom:12px}
.player .row button {font-size:13px;padding:11px 6px}
.note {color:var(--muted);font-size:13px;line-height:1.7}
footer{text-align:center;color:#7683a3;font-size:12px;padding:16px}
#message {display:none;margin-bottom:16px;padding:14px;border-radius:14px;background:#27324c}
@media(max-width:560px) {
  body{padding:12px 10px 30px}
  .players{grid-template-columns:1fr}
  .panel,.player{padding:15px}
  .logo{font-size:40px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">🤐🎮</div>
    <h1>ห้ามพูด!</h1>
    <div class="subtitle">FORBIDDEN WORD · เกมวัดใจในหมู่เพื่อน</div>
  </header>

  <section class="panel">
    <h2>⚙️ ตั้งค่าเกม</h2>
    <label for="playerCount">จำนวนผู้เล่น</label>
    <select id="playerCount">
      <option value="2">2 คน</option>
      <option value="3">3 คน</option>
      <option value="4" selected>4 คน</option>
    </select>
    <div style="height:12px"></div>
    <label for="wordMode">รูปแบบคำต้องห้าม</label>
    <select id="wordMode">
      <option value="all">รวมทุกหมวด — แนะนำ</option>
      <option value="daily">คำพูดติดปาก</option>
      <option value="gaming">คำเกมและการ์ดเกม</option>
      <option value="friends">คำแซวเพื่อนและคำสบถ</option>
      <option value="slang">ศัพท์วัยรุ่น</option>
    </select>
    <div style="height:14px"></div>
    <div class="row">
      <button class="primary" id="newGame">🎲 เริ่มเกมใหม่ / สุ่มคำใหม่</button>
    </div>
    <p class="note">กติกา: ดูคำของตัวเองแล้วพยายามไม่พูดคำนั้นให้ครบ 5 นาที ถ้าหลุดให้กด “พูดแล้ว!” และรับโทษ 5 นาที ไม่มีระบบคะแนน</p>
  </section>

  <div id="message"></div>
  <div id="players" class="players"></div>

  <footer>เล่นกับเพื่อนอย่างสนุก · ผู้เล่นเป็นผู้ตัดสินว่าพูดคำต้องห้ามหรือไม่</footer>
</div>

const $ = id => document.getElementById(id);
const playersEl = $("players");
const message = $("message");
let players = [];
let nextId = 0;
let tickHandle = null;

function getWordPool() {
  const mode = $("wordMode").value;
  const source = mode === "all"
    ? Object.values(WORDS).join("|")
    : WORDS[mode];
  return [...new Set(source.split("|").map(w => w.trim()).filter(Boolean))];
}

function randomWord(exclude = []) {
  const pool = getWordPool().filter(w => !exclude.includes(w));
  const choices = pool.length ? pool : getWordPool();
  return choices[Math.floor(Math.random() * choices.length)];
}

function fmt(seconds) {
  seconds = Math.max(0, seconds);
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function stopTicker() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = null;
}

function startTicker() {
  stopTicker();
  tickHandle = setInterval(() => {
    let active = false;
    players.forEach(p => {
      if (p.state === "playing" || p.state === "penalty") {
        active = true;
        p.remaining--;
        if (p.remaining <= 0) {
          p.remaining = 0;
          if (p.state === "playing") {
            p.state = "survived";
          } else {
            p.state = "ready";
          }
        }
      }
    });
    renderPlayers();
    if (!active) stopTicker();
  }, 1000);
}

function startPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p || p.state === "playing" || p.state === "penalty") return;
  p.state = "playing";
  p.remaining = 300;
  p.revealed = true;
  startTicker();
  renderPlayers();
}

function losePlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p || p.state !== "playing") return;
  p.state = "penalty";
  p.remaining = 300;
  startTicker();
  renderPlayers();
}

function survivePlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p || p.state !== "playing" || p.remaining > 0) return;
  p.state = "survived";
  renderPlayers();
}

function revealWord(id) {
  const p = players.find(x => x.id === id);
  if (p) {
    p.revealed = !p.revealed;
    renderPlayers();
  }
}

function resetPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  p.word = randomWord(players.filter(x => x.id !== id).map(x => x.word));
  p.state = "ready";
  p.remaining = 300;
  p.revealed = false;
  renderPlayers();
}

function renderPlayers() {
  playersEl.innerHTML = "";
  players.forEach(p => {
    const isPlaying = p.state === "playing";
    const isPenalty = p.state === "penalty";
    let status = "พร้อมเล่น";
    let statusColor = "";
    if (isPlaying) { status = "กำลังเล่น"; statusColor = "color:var(--green)"; }
    if (isPenalty) { status = "ติดโทษ"; statusColor = "color:var(--red)"; }
    if (p.state === "survived") { status = "🎉 รอดครบ 5 นาที!"; statusColor = "color:var(--green)"; }
    const clock = (isPlaying || isPenalty) ? fmt(p.remaining) :
      (p.state === "survived" ? "รอดแล้ว" : "05:00");
    const word = p.revealed ? p.word : "••••••";
    const card = document.createElement("section");
    card.className = "player";
    card.innerHTML = `
      <h2>👤 ผู้เล่น ${p.number} <span class="badge">${status}</span></h2>
      <div class="word">
        <small>คำต้องห้ามของคุณ</small>
        <strong class="${p.revealed ? "" : "hidden-word"}">${word}</strong>
      </div>
      <div class="row">
        <button class="secondary reveal">👁 ${p.revealed ? "ซ่อนคำ" : "ดูคำ"}</button>
        <button class="secondary reroll">🎲 สุ่มคำใหม่</button>
      </div>
      <div class="clock">${clock}</div>
      <div class="status" style="${statusColor}">${isPenalty ? "ลงโทษ: รอให้ครบ 5 นาที" : status}</div>
      <div class="row">
        <button class="primary start" ${isPlaying || isPenalty || p.state === "survived" ? "disabled" : ""}>▶ เริ่ม 5 นาที</button>
        <button class="danger lose" ${!isPlaying ? "disabled" : ""}>🤐 พูดแล้ว!</button>
      </div>
      <div style="height:8px"></div>
      <div class="row">
        <button class="success survived" ${!(isPlaying && p.remaining === 0) ? "disabled" : ""}>🏆 รอดครบเวลา</button>
      </div>
    `;
    card.querySelector(".reveal").onclick = () => revealWord(p.id);
    card.querySelector(".reroll").onclick = () => resetPlayer(p.id);
    card.querySelector(".start").onclick = () => startPlayer(p.id);
    card.querySelector(".lose").onclick = () => losePlayer(p.id);
    card.querySelector(".survived").onclick = () => survivePlayer(p.id);
    playersEl.appendChild(card);
  });
}

function newGame() {
  stopTicker();
  players = [];
  const count = Number($("playerCount").value);
  const used = [];
  for (let i = 1; i <= count; i++) {
    const word = randomWord(used);
    used.push(word);
    players.push({
      id: ++nextId,
      number: i,
      word,
      state: "ready",
      remaining: 300,
      revealed: false
    });
  }
  message.style.display = "block";
  message.textContent = "เกมใหม่พร้อมแล้ว! ให้แต่ละคนกด “ดูคำ” ทีละคน อย่าแอบดูคำของเพื่อน 🤫";
  renderPlayers();
}

$("newGame").addEventListener("click", newGame);
$("wordMode").addEventListener("change", () => {
  message.style.display = "block";
  message.textContent = "เปลี่ยนหมวดคำแล้ว กด “เริ่มเกมใหม่ / สุ่มคำใหม่” เพื่อใช้หมวดนี้";
});
newGame();
</script>
</body>
</html>
